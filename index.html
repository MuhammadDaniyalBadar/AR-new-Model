<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9f4" />
    <meta name="description" content="See our dishes in 3D and AR before you order." />
    <title>Menu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    />
  </head>
  <body>
    <section id="screen-menu" hidden></section>
    <section id="screen-viewer" hidden></section>

    <!-- Becomes the WebXR DOM overlay while AR is running -->
    <div id="ar-overlay" class="ar" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>This menu needs JavaScript to show dishes in 3D.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
